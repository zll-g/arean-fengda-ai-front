      /* HTML5 display-role reset for older browsers */
      article,
      aside,
      details,
      figcaption,
      figure,
      footer,
      header,
      hgroup,
      menu,
      nav,
      section {
        display: block;
      }

      body {
        line-height: 1;
      }

      ol,
      ul {
        list-style: none;
      }

      blockquote,
      q {
        quotes: none;
      }

      blockquote::before,
      blockquote::after,
      q::before,
      q::after {
        content: '';
        content: none;
      }

      table {
        border-spacing: 0;
        border-collapse: collapse;
      }

      /************ 加载动画 *************/
      #em-loader-wrap {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      #em-loader {
        width: 120px;
        height: 120px;
        margin-top: -120px;
      }

      #em-loader hr {
        position: absolute;
        width: 40px;
        height: 40px;
        margin: 0;
        border: 0;
        border-radius: 4px;
        animation: spin 2s ease infinite;
      }

      #em-loader :first-child {
        background: #19a68c;
        animation-delay: -1.5s;
      }

      #em-loader :nth-child(2) {
        background: #f63d3a;
        animation-delay: -1s;
      }

      #em-loader :nth-child(3) {
        background: #fda543;
        animation-delay: -0.5s;
      }

      #em-loader :last-child {
        background: #193b48;
      }

      .em-loader-tip {
        margin-top: 20px;
        font-size: 14px;
        color: #909399;
        text-align: center;
        letter-spacing: 2px;
      }

      @keyframes spin {
        0%,
        100% {
          transform: translate(0);
        }

        25% {
          transform: translate(160%);
        }

        50% {
          transform: translate(160%, 160%);
        }

        75% {
          transform: translate(0, 160%);
        }
      }
